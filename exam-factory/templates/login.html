{% extends "base.html" %}
{% block title %}登录 - 试卷工厂{% endblock %}

{% block body %}
<div class="login-wrapper">
    <div class="card login-card">
        <h1>试卷工厂</h1>
        <p class="subtitle">输入邮箱，验证码登录</p>

        <div id="alert" class="alert"></div>

        <form id="loginForm" onsubmit="return false;">
            <div class="form-group">
                <label for="email">邮箱地址</label>
                <input type="email" id="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label for="code">验证码</label>
                <div class="code-input-group">
                    <input type="text" id="code" placeholder="6 位验证码" maxlength="6" required>
                    <button type="button" class="btn btn-secondary" id="sendCodeBtn" onclick="sendCode()">
                        发送验证码
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="loginBtn" onclick="login()">
                登录
            </button>
        </form>

        <div class="login-divider">
            <span>其他登录方式</span>
        </div>

        <button class="btn btn-wechat btn-block" disabled>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="margin-right:6px;vertical-align:middle;">
                <path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 01.213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 00.167-.054l1.903-1.114a.864.864 0 01.717-.098 10.16 10.16 0 002.837.403c.276 0 .543-.027.811-.05a6.127 6.127 0 01-.253-1.736c0-3.74 3.568-6.768 7.969-6.768.267 0 .527.022.788.042C17.237 4.956 13.327 2.188 8.691 2.188zm-2.35 4.79a1.04 1.04 0 110-2.08 1.04 1.04 0 010 2.08zm4.652 0a1.04 1.04 0 110-2.08 1.04 1.04 0 010 2.08zm5.327 3.875c-3.844 0-6.969 2.634-6.969 5.884 0 3.252 3.125 5.884 6.969 5.884a8.49 8.49 0 002.344-.339.724.724 0 01.592.08l1.57.919a.273.273 0 00.14.045c.132 0 .238-.108.238-.243 0-.06-.023-.118-.04-.175l-.322-1.218a.493.493 0 01.176-.547C21.814 19.9 22.79 18.156 22.79 16.237v-.5c-.156-2.97-3.167-5.384-6.97-5.384zm-2.37 3.266a.868.868 0 110-1.735.868.868 0 010 1.735zm4.739 0a.868.868 0 110-1.735.868.868 0 010 1.735z"/>
            </svg>
            微信登录（即将开放）
        </button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let countdown = 0;

    function showAlert(msg, type) {
        const el = document.getElementById('alert');
        el.textContent = msg;
        el.className = `alert show alert-${type}`;
        if (type === 'success') setTimeout(() => el.classList.remove('show'), 3000);
    }

    async function sendCode() {
        const email = document.getElementById('email').value.trim();
        if (!email) { showAlert('请输入邮箱', 'error'); return; }

        const btn = document.getElementById('sendCodeBtn');
        btn.disabled = true;

        try {
            const form = new FormData();
            form.append('email', email);
            const res = await fetch('/api/auth/send-code', { method: 'POST', body: form });
            const data = await res.json();

            if (res.ok) {
                showAlert('验证码已发送，请查收邮件', 'success');
                countdown = 60;
                const timer = setInterval(() => {
                    countdown--;
                    btn.textContent = `${countdown}s`;
                    if (countdown <= 0) {
                        clearInterval(timer);
                        btn.textContent = '发送验证码';
                        btn.disabled = false;
                    }
                }, 1000);
            } else {
                showAlert(data.detail || '发送失败', 'error');
                btn.disabled = false;
            }
        } catch (e) {
            showAlert('网络错误', 'error');
            btn.disabled = false;
        }
    }

    async function login() {
        const email = document.getElementById('email').value.trim();
        const code = document.getElementById('code').value.trim();
        if (!email || !code) { showAlert('请填写邮箱和验证码', 'error'); return; }

        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = '登录中...';

        try {
            const form = new FormData();
            form.append('email', email);
            form.append('code', code);
            const res = await fetch('/api/auth/login', { method: 'POST', body: form });
            const data = await res.json();

            if (res.ok) {
                window.location.href = '/workspace';
            } else {
                showAlert(data.detail || '登录失败', 'error');
                btn.disabled = false;
                btn.textContent = '登录';
            }
        } catch (e) {
            showAlert('网络错误', 'error');
            btn.disabled = false;
            btn.textContent = '登录';
        }
    }

    // 回车提交
    document.getElementById('code').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') login();
    });
</script>
{% endblock %}
