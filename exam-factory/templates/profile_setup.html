{% extends "base.html" %}
{% block title %}完善资料 - 试卷工厂{% endblock %}

{% block head %}
<style>
    .login-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--primary-light), #f0f4ff);
    }

    .setup-card {
        width: 440px;
        padding: 40px;
        background: var(--card-bg);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
    }

    .setup-card h1 {
        text-align: center;
        color: var(--primary);
        margin-bottom: 8px;
        font-size: 24px;
    }

    .setup-card .subtitle {
        text-align: center;
        color: var(--text-muted);
        margin-bottom: 32px;
        font-size: 15px;
    }

    .section-label {
        font-size: 14px;
        font-weight: 500;
        color: var(--text);
        margin-bottom: 12px;
    }

    .avatar-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 24px;
    }

    .avatar-item {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 28px;
        border: 3px solid transparent;
        transition: all 0.2s;
        margin: 0 auto;
    }

    .avatar-item:hover {
        transform: scale(1.05);
        opacity: 0.9;
    }

    .avatar-item.selected {
        border-color: var(--primary);
        transform: scale(1.1);
        box-shadow: 0 0 0 2px white, 0 0 0 5px var(--primary);
    }

    .form-group {
        margin-bottom: 24px;
    }

    .form-group label {
        display: block;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 6px;
        color: var(--text);
    }

    .form-group input {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 15px;
        transition: border-color 0.2s;
        font-family: inherit;
    }

    .form-group input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-light);
    }

    .btn-enter {
        width: 100%;
        padding: 12px 24px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 8px;
    }

    .btn-enter:hover {
        background: var(--primary-dark);
    }

    .btn-enter:disabled {
        background: #aed5c8;
        cursor: not-allowed;
    }

    .alert {
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 16px;
        display: none;
    }

    .alert.show {
        display: block;
    }

    .alert-error {
        background: #fde8e8;
        color: var(--danger);
        border: 1px solid #f5c6cb;
    }

    @media (max-width: 768px) {
        .setup-card {
            width: 90%;
            padding: 24px;
        }

        .avatar-grid {
            gap: 8px;
        }

        .avatar-item {
            width: 52px;
            height: 52px;
            font-size: 24px;
        }
    }
</style>
{% endblock %}

{% block body %}
<div class="login-wrapper">
    <div class="setup-card">
        <h1>完善个人资料</h1>
        <p class="subtitle">设置你的用户名和头像</p>

        <div id="alert" class="alert"></div>

        <div class="section-label">选择头像</div>
        <div class="avatar-grid" id="avatarGrid"></div>

        <div class="form-group">
            <label for="nickname">用户名</label>
            <input type="text" id="nickname" placeholder="2-16 个字符" maxlength="16">
        </div>

        <button class="btn-enter" id="submitBtn" onclick="submitProfile()">
            进入工作台
        </button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let selectedAvatarId = null;

    function showAlert(msg, type) {
        const el = document.getElementById('alert');
        el.textContent = msg;
        el.className = `alert show alert-${type}`;
    }

    function hideAlert() {
        document.getElementById('alert').classList.remove('show');
    }

    async function loadAvatars() {
        try {
            const res = await fetch('/api/profile/avatars');
            const avatars = await res.json();
            const grid = document.getElementById('avatarGrid');
            grid.innerHTML = '';

            avatars.forEach(avatar => {
                const item = document.createElement('div');
                item.className = 'avatar-item';
                item.style.background = avatar.bg;
                item.textContent = avatar.emoji;
                item.title = avatar.label;
                item.dataset.id = avatar.id;

                item.addEventListener('click', () => {
                    document.querySelectorAll('.avatar-item').forEach(el => el.classList.remove('selected'));
                    item.classList.add('selected');
                    selectedAvatarId = avatar.id;
                    hideAlert();
                });

                grid.appendChild(item);
            });
        } catch (e) {
            showAlert('加载头像失败', 'error');
        }
    }

    async function submitProfile() {
        const nickname = document.getElementById('nickname').value.trim();

        if (!nickname) {
            showAlert('请输入用户名', 'error');
            return;
        }
        if (nickname.length < 2 || nickname.length > 16) {
            showAlert('用户名需要 2-16 个字符', 'error');
            return;
        }
        if (!selectedAvatarId) {
            showAlert('请选择一个头像', 'error');
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = '保存中...';

        try {
            const form = new FormData();
            form.append('nickname', nickname);
            form.append('avatar_id', selectedAvatarId);

            const res = await fetch('/api/profile/setup', {
                method: 'POST',
                body: form,
            });
            const data = await res.json();

            if (res.ok) {
                window.location.href = '/workspace';
            } else {
                showAlert(data.detail || '保存失败', 'error');
                btn.disabled = false;
                btn.textContent = '进入工作台';
            }
        } catch (e) {
            showAlert('网络错误', 'error');
            btn.disabled = false;
            btn.textContent = '进入工作台';
        }
    }

    // 回车提交
    document.getElementById('nickname').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submitProfile();
    });

    // 页面加载时获取头像列表
    loadAvatars();
</script>
{% endblock %}
