<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <!-- 添加Tone.js库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        canvas {
            object-fit: contain;
            touch-action: none;
        }
        .controller {
            position: absolute;
            left: 10px;
            top: 40px;
            background-color: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 5px;
            color: white;
            display: none;  /* 默认隐藏 */
        }
        
        #toggleBtn {
            position: absolute;
            left: 10px;
            top: 10px;
            padding: 5px 10px;
            background-color: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            z-index: 1000;
        }
        
        #toggleBtn:hover {
            background-color: rgba(0,0,0,0.8);
        }

        .slider-container {
            margin: 10px 0;
        }

        .slider-container label {
            display: block;
            margin-bottom: 5px;
        }

        .slider-container input[type="range"] {
            width: 200px;
        }
    </style>
</head>
<body>   
    <button id="toggleBtn">显示控制面板</button>
    <div class="controller">
        <h2>Crystal Balls Controller</h2>
        <div class="slider-container">
          <label for="maxBalls">Max Balls: <span id="maxBallsValue">10</span></label>
          <input type="range" id="maxBalls" min="1" max="100" value="10">
      </div>
        <div class="slider-container">
            <label for="reverb">Reverb: <span id="reverbValue">0.3</span></label>
            <input type="range" id="reverb" min="0" max="1" value="0.3" step="0.1">
        </div>
    </div>

    <!-- Three.js 核心 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Three.js 扩展 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <!-- 你的主脚本 -->
    <script src="sketch.js"></script>

    <script>
        // 添加控制面板的显示/隐藏功能
        const toggleBtn = document.getElementById('toggleBtn');
        const controller = document.querySelector('.controller');
        
        toggleBtn.addEventListener('click', () => {
            const isVisible = controller.style.display === 'block';
            controller.style.display = isVisible ? 'none' : 'block';
            toggleBtn.textContent = isVisible ? '显示控制面板' : '隐藏控制面板';
        });
    </script>
</body>
</html>
