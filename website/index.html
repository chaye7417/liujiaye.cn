<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>liujiaye.cn</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #141414;
            --border: #222;
            --text: #e0e0e0;
            --muted: #888;
            --accent: #4e9b86;
            --accent2: #7c6cf0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 60px 24px;
        }
        header {
            margin-bottom: 48px;
        }
        header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        header p {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
        }
        .section-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 16px;
        }
        .projects {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 48px;
        }
        .project-card {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 24px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s;
        }
        .project-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(78, 155, 134, 0.1);
        }
        .project-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        .project-icon.green { background: rgba(78, 155, 134, 0.15); }
        .project-icon.purple { background: rgba(124, 108, 240, 0.15); }
        .project-info { flex: 1; }
        .project-info h3 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .project-info p {
            font-size: 13px;
            color: var(--muted);
        }
        .project-arrow {
            color: var(--muted);
            font-size: 18px;
            transition: transform 0.2s;
        }
        .project-card:hover .project-arrow {
            transform: translateX(4px);
            color: var(--accent);
        }
        .tag {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(78, 155, 134, 0.12);
            color: var(--accent);
            margin-top: 4px;
        }
        .tag.purple {
            background: rgba(124, 108, 240, 0.12);
            color: var(--accent2);
        }
        footer {
            color: var(--muted);
            font-size: 13px;
            padding-top: 32px;
            border-top: 1px solid var(--border);
        }
        footer a { color: var(--muted); }
        @media (max-width: 600px) {
            .container { padding: 40px 16px; }
            header h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>liujiaye.cn</h1>
            <p>个人项目展示</p>
        </header>

        <div class="section-title">Projects</div>
        <div class="projects">
            <a href="/circlebeats/" class="project-card">
                <div class="project-icon purple">&#127925;</div>
                <div class="project-info">
                    <h3>CircleBeats</h3>
                    <p>交互式节奏圆环 - 基于 Web 的音乐创作平台</p>
                    <span class="tag purple">p5.js / Tone.js / Three.js</span>
                </div>
                <span class="project-arrow">&rarr;</span>
            </a>

            <a href="/crystal-balls/" class="project-card">
                <div class="project-icon purple">&#128302;</div>
                <div class="project-info">
                    <h3>Crystal Balls</h3>
                    <p>3D 水晶球音乐可视化 - 点击空间生成声光交互</p>
                    <span class="tag purple">Three.js / Tone.js</span>
                </div>
                <span class="project-arrow">&rarr;</span>
            </a>

            <a href="/workspace" class="project-card">
                <div class="project-icon green">&#128196;</div>
                <div class="project-info">
                    <h3>试卷工厂</h3>
                    <p>上传文件，AI 识别题目，一键生成专业排版 PDF 试卷</p>
                    <span class="tag">FastAPI / LaTeX / AI</span>
                </div>
                <span class="project-arrow">&rarr;</span>
            </a>
        </div>

        <footer>
            <p>&copy; 2025 liujiaye.cn &nbsp;|&nbsp; <a href="https://beian.miit.gov.cn/" target="_blank">冀ICP备2025114703号-1</a></p>
        </footer>
    </div>
</body>
</html>
