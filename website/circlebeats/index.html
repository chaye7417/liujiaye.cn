    // 缓存刷新系统

      var SITE_VERSION = '1.0.1_20241225_1';
      var storedVersion = localStorage.getItem('site_version');
      
      // 检查版本是否变更
      if (!storedVersion || storedVersion !== SITE_VERSION) {

        
        // 清除缓存数据
        localStorage.clear();
        sessionStorage.clear();
        
        // 更新存储的版本号
        localStorage.setItem('site_version', SITE_VERSION);
        
        // 如果不是首次访问（存在旧版本号），强制刷新页面

            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .resize-handle:hover {
            background: rgba(76, 175, 80, 0.5);
        }
        
        .resize-handle.active {
            background: rgba(76, 175, 80, 0.8);
        }
        
        /* 垂直拖拽分隔线（左右分栏） */
        .resize-handle-vertical {
            width: 4px;
            cursor: col-resize;
            min-width: 4px;
        }
        
        /* 水平拖拽分隔线（上下分栏） */
        .resize-handle-horizontal {
            height: 4px;
            cursor: row-resize;
            min-height: 4px;
        }
        
        /* 拖拽时的视觉反馈 */
        .resize-handle::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2px;
            height: 30px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 1px;
            transition: all 0.2s ease;
        }
        
        .resize-handle-horizontal::before {
            width: 30px;
            height: 2px;
        }
        
        /* 悬停时显示更明显的拖拽图标 */
        .resize-handle:hover::before {
            background: rgba(255, 255, 255, 0.8);
            width: 3px;
            height: 40px;
        }
        
        .resize-handle-horizontal:hover::before {
            width: 40px;
            height: 3px;
        }
        
        /* 添加拖拽图标 */
        .resize-handle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }
        
        .resize-handle-vertical::after {
            content: '⋮⋮';
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            line-height: 8px;
            letter-spacing: -2px;
            writing-mode: vertical-lr;
        }
        
        .resize-handle-horizontal::after {
            content: '⋯';
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            line-height: 4px;
        }
        
        .resize-handle:hover::after {
            opacity: 1;
        }
        
        /* 拖拽过程中禁用选择 */
        .resizing {
            user-select: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
        }
        
        .resizing * {
            pointer-events: none !important;
        }

        // 创建DOM观察器，确保lil-gui控制面板始终可以点击
        function setupGuiObserver() {
            // 创建一个检查和修复lil-gui控制面板的函数
            function ensureGuiWorks() {
                const lilGuiElements = document.querySelectorAll('.lil-gui');
                if (lilGuiElements.length > 0) {
                    lilGuiElements.forEach(guiElement => {
                        guiElement.style.zIndex = '1000';
                        guiElement.style.pointerEvents = 'auto';
                        
                        // 确保所有控制器都可点击
                        const controllers = guiElement.querySelectorAll('.controller');
                        controllers.forEach(controller => {
                            controller.style.pointerEvents = 'auto';
                        });
                        
                        // 确保所有输入元素都可点击
                        const inputs = guiElement.querySelectorAll('input, select, .slider');
                        inputs.forEach(input => {
                            input.style.pointerEvents = 'auto';
                            input.style.zIndex = '1001';
                        });
                    });
                }
            }
            
            // 立即运行一次
            ensureGuiWorks();
            
            // 设置定期检查，确保在隐藏/显示Rhythm后控制面板仍能正常工作
            setInterval(ensureGuiWorks, 2000);
            
            // 创建一个MutationObserver来监视DOM变化
            const observer = new MutationObserver((mutations) => {
                // 当DOM变化时，检查是否有新的lil-gui元素出现
                for (const mutation of mutations) {
                    if (mutation.type === 'childList' && mutation.addedNodes.length > 0) {
                        // 当有新节点添加时，检查是否有lil-gui
                        setTimeout(ensureGuiWorks, 100);
                        break;
                    }
                }
            });
            
            // 开始观察body的变化
            observer.observe(document.body, { 
                childList: true,
                subtree: true
            });
            
            return observer;
        }

        // 初始化Tone.js Transport系统
        function initToneTransport() {
            if (typeof Tone === 'undefined') {
                console.warn('Tone.js未加载，无法初始化Transport');
                return;
            }
            
            // 设置全局Transport设置
            Tone.Transport.timeSignature = [4, 4]; // 4/4拍
            
            // 设置音频引擎参数
            Tone.context.latencyHint = 'interactive'; // 设置为交互式延迟模式，降低延迟
            
            // 设置全局延迟补偿，帮助解决第一个音符不发声的问题
            Tone.context.lookAhead = 0.05; // 增加提前量到50ms，确保有足够时间处理第一个音符
            
            // 确保页面关闭时暂停Transport
            window.addEventListener('beforeunload', () => {
                if (Tone.Transport.state === 'started') {
                    Tone.Transport.stop();
                }
            });
            
            // 添加一个音频测试函数到window对象
            window.testToneAudio = function() {
                if (typeof Tone === 'undefined') {
                    console.error('Tone.js未加载，无法进行测试');
                    return;
                }
                
                // 确保音频上下文已启动
                if (Tone.context.state !== 'running') {
                    Tone.start().then(testAudio).catch(err => {
                        console.error('启动音频上下文失败:', err);
                        alert('无法启动音频上下文，请点击页面再试一次');
                    });
                } else {
                    testAudio();
                }
                
                function testAudio() {
                    // 创建一个简单的合成器
                    const testSynth = new Tone.Synth({
                        oscillator: {
                            type: 'triangle'
                        },
                        envelope: {
                            attack: 0.01,
                            decay: 0.1,
                            sustain: 0.3,
                            release: 0.1
                        }
                    }).toDestination();
                    
                    // 播放一个C大调音阶
                    const now = Tone.now();
                    testSynth.triggerAttackRelease('C4', '8n', now);
                    testSynth.triggerAttackRelease('D4', '8n', now + 0.25);
                    testSynth.triggerAttackRelease('E4', '8n', now + 0.5);
                    testSynth.triggerAttackRelease('F4', '8n', now + 0.75);
                    testSynth.triggerAttackRelease('G4', '8n', now + 1.0);
                    

                    
                    // 3秒后销毁合成器
                    setTimeout(() => {
                        testSynth.dispose();
                    }, 3000);
                }
            };
            

        }
        
        // 设置Tone.js音频解锁
        function setupToneAudioUnlock() {
            let hasUnlocked = false;
            
            // 添加多种事件监听器以确保能捕获第一次用户交互
            const unlockAudio = () => {
                if (hasUnlocked) return; // 防止重复解锁
                
                if (typeof Tone !== 'undefined' && Tone.context && Tone.context.state !== 'running') {

                    
                    // 尝试启动音频上下文
                    Tone.start().then(() => {

                        hasUnlocked = true;
                        
                        // 如果有全局步进器实例，尝试初始化音频
                        if (window.metronome && typeof window.metronome.initSound === 'function') {
                            window.metronome.initSound();
                            
                            // 播放一个测试音符以确认音频正在工作
                            setTimeout(() => {
                                if (window.metronome && typeof window.metronome.playTestSound === 'function') {
                                    window.metronome.playTestSound();
                                }
                            }, 500);
                        }
                        
                        // 移除所有事件监听器
                        removeAllListeners();
                    }).catch(err => {
                        console.warn('启动Tone.js音频上下文失败:', err);
                    });
                }
            };
            
            // 添加事件监听器
            document.addEventListener('click', unlockAudio);
            document.addEventListener('keydown', unlockAudio);
            document.addEventListener('touchstart', unlockAudio);
            
            // 创建一个函数用于移除所有事件监听器
            function removeAllListeners() {
                document.removeEventListener('click', unlockAudio);
                document.removeEventListener('keydown', unlockAudio);
                document.removeEventListener('touchstart', unlockAudio);

            }
            
            // 如果5秒后仍未解锁，显示提示给用户
            setTimeout(() => {
                if (!hasUnlocked && typeof Tone !== 'undefined' && Tone.context && Tone.context.state !== 'running') {
                    console.warn('音频上下文未自动启动，请点击或触摸页面以启用声音');
                }
            }, 5000);
            

        }
        
        // 初始化拖拽调节功能
        function initResizableLayout() {
            const verticalHandle = document.getElementById('vertical-resize-handle');
            const horizontalHandle = document.getElementById('horizontal-resize-handle');
            
            let isResizing = false;
            let resizeType = null;
            let startX = 0;
            let startY = 0;
            let startSize = 0;
            
            // 垂直分隔线拖拽（调节左右分栏）
            if (verticalHandle) {
                const startVerticalResize = (e) => {
                    isResizing = true;
                    resizeType = 'vertical';
                    
                    // 兼容鼠标和触摸事件
                    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                    startX = clientX;
                    
                    // 获取当前右侧面板宽度
                    const computedStyle = getComputedStyle(document.body);
                    const gridColumns = computedStyle.gridTemplateColumns;
                    const rightPanelWidth = parseInt(gridColumns.split(' ')[2]) || 450;
                    startSize = rightPanelWidth;
                    
                    document.body.classList.add('resizing');
                    verticalHandle.classList.add('active');
                    
                    e.preventDefault();
                };
                
                verticalHandle.addEventListener('mousedown', startVerticalResize);
                verticalHandle.addEventListener('touchstart', startVerticalResize, { passive: false });
            }
            
            // 水平分隔线拖拽（调节上下分栏）
            if (horizontalHandle) {
                const startHorizontalResize = (e) => {
                    isResizing = true;
                    resizeType = 'horizontal';
                    
                    // 兼容鼠标和触摸事件
                    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                    startY = clientY;
                    
                    // 获取当前总览面板高度
                    const mainInterface = document.querySelector('.main-interface');
                    const computedStyle = getComputedStyle(mainInterface);
                    const gridRows = computedStyle.gridTemplateRows;
                    const overviewHeight = parseInt(gridRows.split(' ')[2]) || 350;
                    startSize = overviewHeight;
                    
                    document.body.classList.add('resizing');
                    horizontalHandle.classList.add('active');
                    
                    e.preventDefault();
                };
                
                horizontalHandle.addEventListener('mousedown', startHorizontalResize);
                horizontalHandle.addEventListener('touchstart', startHorizontalResize, { passive: false });
            }
            
            // 鼠标和触摸移动处理
            const handleMove = (e) => {
                if (!isResizing) return;
                
                if (resizeType === 'vertical') {
                    // 兼容鼠标和触摸事件
                    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                    const deltaX = startX - clientX;
                    const newWidth = Math.max(200, Math.min(800, startSize + deltaX));
                    
                    // 更新grid布局
                    document.body.style.gridTemplateColumns = `1fr 4px ${newWidth}px`;
                    
                    // 触发Three.js场景resize
                    setTimeout(() => {
                        if (typeof window.resizeThreeScene === 'function') {
                            window.resizeThreeScene();
                        }
                    }, 10);
                    
                } else if (resizeType === 'horizontal') {
                    // 兼容鼠标和触摸事件
                    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                    const deltaY = startY - clientY;
                    const newHeight = Math.max(100, Math.min(600, startSize + deltaY));
                    
                    // 更新grid布局
                    const mainInterface = document.querySelector('.main-interface');
                    mainInterface.style.gridTemplateRows = `1fr 4px ${newHeight}px`;
                    
                    // 触发总览视图refresh
                    setTimeout(() => {
                        if (window.circleOverview && typeof window.circleOverview.refresh === 'function') {
                            window.circleOverview.refresh();
                        }
                    }, 10);
                }
                
                e.preventDefault();
            };
            
            document.addEventListener('mousemove', handleMove);
            document.addEventListener('touchmove', handleMove, { passive: false });
            
            // 鼠标和触摸释放处理
            const handleEnd = () => {
                if (isResizing) {
                    isResizing = false;
                    resizeType = null;
                    
                    document.body.classList.remove('resizing');
                    if (verticalHandle) verticalHandle.classList.remove('active');
                    if (horizontalHandle) horizontalHandle.classList.remove('active');
                    
                    // 延迟触发最终的resize事件
                    setTimeout(() => {
                        if (typeof window.resizeThreeScene === 'function') {
                            window.resizeThreeScene();
                        }
                        if (window.circleOverview && typeof window.circleOverview.refresh === 'function') {
                            window.circleOverview.refresh();
                        }
                    }, 100);
                }
            };
            
            document.addEventListener('mouseup', handleEnd);
            document.addEventListener('touchend', handleEnd);
            
            console.log('🔧 拖拽调节功能已初始化');
        }
        
        // 初始化响应式检测
        function initResponsiveDetection() {
            let currentBreakpoint = '';
            
            function checkBreakpoint() {
                const width = window.innerWidth;
                let newBreakpoint = '';
                
                if (width <= 768) {
                    newBreakpoint = 'mobile';
                } else if (width <= 1024) {
                    newBreakpoint = 'tablet';
                } else {
                    newBreakpoint = 'desktop';
                }
                
                // 如果断点发生变化
                if (newBreakpoint !== currentBreakpoint) {
                    const wasDesktop = currentBreakpoint === 'desktop';
                    const isDesktop = newBreakpoint === 'desktop';
                    
                    currentBreakpoint = newBreakpoint;
                    console.log(`📱 屏幕断点变化: ${currentBreakpoint} (${width}px)`);
                    
                    // 根据断点自动调整面板显示
                    const body = document.body;
                    const visualizerPanel = document.getElementById('visualizer-panel');
                    const overviewPanel = document.getElementById('overview-panel');
                    const mainInterface = document.querySelector('.main-interface');
                    const toggleVisualizerButton = document.getElementById('toggle-visualizer-button');
                    const toggleOverviewButton = document.getElementById('toggle-overview-button');
                    
                    if (newBreakpoint === 'mobile') {
                        // 手机：隐藏所有额外面板
                        body.classList.add('hide-visualizer');
                        mainInterface.classList.add('hide-overview');
                        if (visualizerPanel) visualizerPanel.classList.add('hidden');
                        if (overviewPanel) overviewPanel.classList.add('hidden');
                        
                        if (toggleVisualizerButton) toggleVisualizerButton.textContent = '🎵 可视化器';
                        if (toggleOverviewButton) toggleOverviewButton.textContent = '📊 总览';
                        
                    } else if (newBreakpoint === 'tablet') {
                        // 平板：仅隐藏可视化器
                        body.classList.add('hide-visualizer');
                        if (visualizerPanel) visualizerPanel.classList.add('hidden');
                        if (toggleVisualizerButton) toggleVisualizerButton.textContent = '🎵 可视化器';
                        
                        // 但可以显示总览视图（如果之前是显示状态）
                        if (!mainInterface.classList.contains('hide-overview')) {
                            mainInterface.classList.remove('hide-overview');
                            overviewPanel.classList.remove('hidden');
                            toggleOverviewButton.textContent = window.languageManager ? 
                                window.languageManager.getText('controls', 'hideOverview') : 
                                '📊 隐藏总览';
                        }
                        
                    } else if (newBreakpoint === 'desktop') {
                        // 桌面：可以显示所有面板（恢复之前的状态）
                        // 但不自动显示，保持用户的选择
                    }
                    
                    // 重置grid样式，确保媒体查询生效
                    if (newBreakpoint !== 'desktop') {
                        body.style.gridTemplateColumns = '';
                        if (mainInterface) mainInterface.style.gridTemplateRows = '';
                    }
                    
                    // 延迟触发resize事件
                    setTimeout(() => {
                        if (typeof window.resizeThreeScene === 'function') {
                            window.resizeThreeScene();
                        }
                        if (window.circleOverview && typeof window.circleOverview.refresh === 'function') {
                            window.circleOverview.refresh();
                        }
                    }, 100);
                }
            }
            
            // 初始检查
            checkBreakpoint();
            
            // 监听窗口大小变化
            window.addEventListener('resize', () => {
                // 使用节流防止过于频繁的调用
                clearTimeout(window.resizeTimeout);
                window.resizeTimeout = setTimeout(checkBreakpoint, 150);
            });
            
            console.log('📱 响应式检测已初始化');
        }
        
        // 设置控制按钮的悬停行为
        function setupControlsHoverBehavior() {
            const hoverZone = document.getElementById('hover-zone');
            const controlsContainer = document.getElementById('controls-container');
            
            if (!hoverZone || !controlsContainer) return;
            
            // 添加鼠标移动到热区的事件处理
            hoverZone.addEventListener('mouseenter', () => {
                controlsContainer.style.opacity = '1';
                controlsContainer.style.visibility = 'visible';
            });
            
            // 添加鼠标移动到控制容器的事件处理
            controlsContainer.addEventListener('mouseenter', () => {
                controlsContainer.style.opacity = '1';
                controlsContainer.style.visibility = 'visible';
            });
            
            // 添加鼠标离开热区的事件处理
            hoverZone.addEventListener('mouseleave', (event) => {
                // 检查鼠标是否移动到了控制容器上
                if (!isMouseOverElement(event, controlsContainer)) {
                    controlsContainer.style.opacity = '0';
                    controlsContainer.style.visibility = 'hidden';
                }
            });
            
            // 添加鼠标离开控制容器的事件处理
            controlsContainer.addEventListener('mouseleave', (event) => {
                // 检查鼠标是否移动到了热区上
                if (!isMouseOverElement(event, hoverZone)) {
                    controlsContainer.style.opacity = '0';
                    controlsContainer.style.visibility = 'hidden';
                }
            });
            
            // 辅助函数：检查鼠标是否在指定元素上
            function isMouseOverElement(event, element) {
                const rect = element.getBoundingClientRect();
                return (
                    event.clientX >= rect.left &&
                    event.clientX <= rect.right &&
                    event.clientY >= rect.top &&
                    event.clientY <= rect.bottom
                );
            }
            

        }
    </script>
